<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Affordable Healthcare Finder</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
font-family:Arial,sans-serif;
background:linear-gradient(to right,#dbeafe,#ffffff,#dcfce7);
}

.card:hover{
transform:translateY(-5px);
transition:0.3s;
}

</style>

</head>

<body>

<!-- LOGIN PAGE -->

<section
id="loginPage"
class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">

<h1 class="text-4xl font-bold text-center text-blue-700 mb-8">

🏥 Healthcare Finder

</h1>

<input
id="nameInput"
type="text"
placeholder="Enter Your Name"
class="w-full p-4 border rounded-2xl mb-4">

<input
id="budgetInput"
type="number"
placeholder="Enter Your Budget"
class="w-full p-4 border rounded-2xl mb-4">

<button
onclick="loginUser()"
class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl text-xl font-bold">

Login

</button>

</div>

</section>

<!-- MAIN APP -->

<div id="mainApp" class="hidden">

<!-- NAVBAR -->

<nav
class="bg-white shadow-lg p-5 flex justify-between items-center sticky top-0 z-50">

<h1 class="text-3xl font-bold text-blue-700">

🩺 Healthcare Finder

</h1>

<div class="flex gap-3">

<button
onclick="openLanguageModal()"
class="bg-green-500 hover:bg-green-600 text-white px-5 py-3 rounded-xl font-bold">

🎤 Voice

</button>

<button
onclick="stopVoice()"
class="bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-xl font-bold">

⛔ Stop

</button>

</div>

</nav>

<!-- WELCOME -->

<section class="text-center py-10 px-5">

<h2
id="welcomeText"
class="text-5xl font-bold text-blue-700">

</h2>

<p class="mt-5 text-xl text-gray-600">

Search hospitals, scans, tests, treatments,
emergency services and affordable healthcare.

</p>

</section>

<!-- SEARCH -->

<section class="px-6 pb-10">

<div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl">

<input
id="searchInput"
type="text"
placeholder="Search Hospital..."
class="w-full p-5 border rounded-2xl text-lg">

<button
onclick="searchHospital()"
class="w-full mt-5 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl text-xl font-bold">

🔍 Search Hospital

</button>

</div>

</section>

<!-- RESULTS -->

<section
id="hospitalResults"
class="grid md:grid-cols-2 gap-8 p-6">

</section>

<!-- EMERGENCY -->

<section class="p-6">

<div
class="bg-red-500 text-white rounded-3xl p-10 text-center shadow-2xl">

<h2 class="text-5xl font-bold">

🚑 Emergency Support

</h2>

<p class="mt-5 text-lg">

24/7 Ambulance and Emergency Healthcare Services

</p>

<div class="mt-8 flex flex-wrap justify-center gap-5">

<button
onclick="window.location.href='tel:108'"
class="bg-white text-red-600 px-8 py-3 rounded-2xl font-bold">

Call Ambulance

</button>

<button
onclick="window.location.href='tel:102'"
class="bg-white text-red-600 px-8 py-3 rounded-2xl font-bold">

Emergency Call

</button>

</div>

</div>

</section>

</div>

<!-- LANGUAGE MODAL -->

<div
id="languageModal"
class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">

<div class="bg-white p-8 rounded-3xl w-80 text-center">

<h2 class="text-3xl font-bold text-blue-700 mb-6">

Select Language

</h2>

<div class="grid gap-4">

<button
onclick="startVoice('en-US')"
class="bg-blue-600 text-white py-3 rounded-xl">

English

</button>

<button
onclick="startVoice('kn-IN')"
class="bg-green-600 text-white py-3 rounded-xl">

Kannada

</button>

<button
onclick="startVoice('te-IN')"
class="bg-purple-600 text-white py-3 rounded-xl">

Telugu

</button>

<button
onclick="startVoice('hi-IN')"
class="bg-orange-600 text-white py-3 rounded-xl">

Hindi

</button>

</div>

<button
onclick="closeLanguageModal()"
class="mt-6 text-red-500 font-bold">

Close

</button>

</div>

</div>

<script>

function loginUser(){

const name =
document.getElementById("nameInput").value;

const budget =
document.getElementById("budgetInput").value;

if(name === "" || budget === ""){

alert("Please fill all details");

return;

}

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("mainApp")
.classList.remove("hidden");

document.getElementById("welcomeText")
.innerHTML =
"Welcome " + name + " 👋";

}

const hospitals = [

{

name:"BKS Hospital Ballari",

rating:"4.7",

location:"Ballari",

phone:"08392221111",

map:"https://maps.google.com/?q=BKS+Hospital+Ballari",

treatments:[

["MRI Scan","₹7000"],
["CT Scan","₹5000"],
["Blood Test","₹1000"],
["Cancer Treatment","₹2,00,000"],
["Heart Surgery","₹3,50,000"],
["Chemotherapy","₹1,20,000"],
["Radiation Therapy","₹90,000"]

]

},

{

name:"BHHC Hospital Ballari",

rating:"4.8",

location:"Ballari",

phone:"08392222222",

map:"https://maps.google.com/?q=BHHC+Hospital+Ballari",

treatments:[

["MRI Scan","₹8000"],
["Blood Test","₹1200"],
["X-Ray","₹1500"],
["Cancer Diagnosis","₹30,000"],
["Chemotherapy","₹1,50,000"],
["Bone Surgery","₹2,20,000"],
["ICU Treatment","₹50,000"]

]

},

{

name:"Aradhana Hospital",

rating:"4.6",

location:"Ballari",

phone:"08392223333",

map:"https://maps.google.com/?q=Aradhana+Hospital",

treatments:[

["Skin Treatment","₹20,000"],
["Pregnancy Scan","₹4000"],
["Blood Test","₹800"],
["MRI Scan","₹6500"],
["Eye Surgery","₹70,000"],
["Diabetes Treatment","₹25,000"]

]

},

{

name:"Hrudayalaya Hospital",

rating:"4.9",

location:"Ballari",

phone:"08392224444",

map:"https://maps.google.com/?q=Hrudayalaya+Hospital",

treatments:[

["Heart Scan","₹10,000"],
["Heart Surgery","₹4,00,000"],
["Blood Test","₹1500"],
["ECG","₹1200"],
["ICU","₹60,000"],
["Kidney Treatment","₹2,50,000"]

]

}

];

function searchHospital(){

const search =
document.getElementById("searchInput")
.value.toLowerCase();

const result =
document.getElementById("hospitalResults");

result.innerHTML = "";

const filtered =
hospitals.filter(h =>
h.name.toLowerCase().includes(search)
);

if(filtered.length === 0){

result.innerHTML = `

<div class="col-span-2 text-center text-3xl font-bold text-red-500">

No Hospital Found

</div>

`;

return;

}

filtered.forEach(hospital => {

let treatmentsHTML = "";

hospital.treatments.forEach(t => {

treatmentsHTML += `

<div class="bg-gray-100 p-4 rounded-xl mt-3">

<h3 class="font-bold text-lg">
🩺 ${t[0]}
</h3>

<p class="text-green-700 font-semibold">
💰 ${t[1]}
</p>

</div>

`;

});

result.innerHTML += `

<div class="bg-white rounded-3xl p-8 shadow-2xl card">

<h2 class="text-4xl font-bold text-green-600">

${hospital.name}

</h2>

<p class="mt-4 text-xl">
⭐ Rating: ${hospital.rating}
</p>

<p class="mt-2 text-xl">
📍 ${hospital.location}
</p>

<div class="mt-6">

<h3 class="text-2xl font-bold text-blue-700">

Available Treatments & Scans

</h3>

${treatmentsHTML}

</div>

<div class="grid grid-cols-2 gap-4 mt-8">

<button
onclick="window.location.href='tel:${hospital.phone}'"
class="bg-green-500 text-white py-3 rounded-xl font-bold">

📞 Call

</button>

<button
onclick="window.open('${hospital.map}')"
class="bg-purple-500 text-white py-3 rounded-xl font-bold">

📍 Maps

</button>

<button
onclick="bookAppointment('${hospital.name}')"
class="bg-blue-600 text-white py-3 rounded-xl font-bold">

📅 Appointment

</button>

<button
onclick="shareHospital('${hospital.name}')"
class="bg-pink-500 text-white py-3 rounded-xl font-bold">

📤 Share

</button>

</div>

</div>

`;

});

}

function bookAppointment(name){

const patient =
prompt("Enter Patient Name");

if(patient){

alert(
"✅ Appointment booked successfully for "
+ patient +
" at " +
name
);

}

}

function shareHospital(name){

if(navigator.share){

navigator.share({

title:name,

text:"Check this hospital on Healthcare Finder",

url:window.location.href

});

}else{

alert("Sharing not supported");

}

}

function openLanguageModal(){

document.getElementById("languageModal")
.classList.remove("hidden");

}

function closeLanguageModal(){

document.getElementById("languageModal")
.classList.add("hidden");

}

function startVoice(lang){

let text = "";

if(lang === "en-US"){

text =
"Welcome to Affordable Healthcare Finder. Search hospitals, scans, MRI, blood tests, treatments and emergency services.";

}

if(lang === "kn-IN"){

text =
"ಅಫೋರ್ಡಬಲ್ ಹೆಲ್ತ್ ಕೇರ್ ಫೈಂಡರ್ ಗೆ ಸ್ವಾಗತ. ಆಸ್ಪತ್ರೆಗಳು, ಸ್ಕ್ಯಾನ್, ರಕ್ತ ಪರೀಕ್ಷೆ ಮತ್ತು ಚಿಕಿತ್ಸೆಗಳಿಗಾಗಿ ಹುಡುಕಿ.";

}

if(lang === "te-IN"){

text =
"అఫోర్డబుల్ హెల్త్ కేర్ ఫైండర్ కు స్వాగతం. ఆసుపత్రులు, స్కాన్లు మరియు చికిత్సలను వెతకండి.";

}

if(lang === "hi-IN"){

text =
"अफोर्डेबल हेल्थकेयर फाइंडर में आपका स्वागत है। अस्पताल, स्कैन और इलाज खोजें।";

}

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = lang;

speech.rate = 1;

window.speechSynthesis.speak(speech);

closeLanguageModal();

}

function stopVoice(){

window.speechSynthesis.cancel();

}

</script>

</body>

</html>
